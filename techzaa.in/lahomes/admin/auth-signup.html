     <!-- Script Validation Mot de Passe -->
     <script>
        const password = document.getElementById('motDePasse');
        const confirmPassword = document.getElementById('motDePasseConfirm');
        const passwordHelp = document.getElementById('passwordHelp');
        const signupForm = document.getElementById('signupForm');

        function validatePasswords() {
            if (password.value !== confirmPassword.value && confirmPassword.value !== '') {
                passwordHelp.classList.remove('d-none'); // Affiche msg erreur
                confirmPassword.classList.add('is-invalid'); // Style erreur Bootstrap
                return false;
            } else {
                passwordHelp.classList.add('d-none'); // Masque msg erreur
                confirmPassword.classList.remove('is-invalid'); // Enlève style erreur
                return true;
            }
        }

        // Vérifie pendant la saisie
        confirmPassword.addEventListener('input', validatePasswords);
        password.addEventListener('input', validatePasswords); // Vérifie aussi si on modifie le premier champ

        // Vérifie avant soumission
        signupForm.addEventListener('submit', function(event) {
            if (!validatePasswords()) {
                alert("Veuillez vérifier que les mots de passe correspondent.");
                confirmPassword.focus(); // Met le focus sur le champ
                event.preventDefault(); // Empêche l'envoi du formulaire
            }
            // Ici, on pourrait ajouter d'autres validations JS si nécessaire
        });
    </script>
