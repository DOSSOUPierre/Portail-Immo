     <!-- Script pour afficher/masquer mot de passe et gérer la soumission/erreur -->
     <script>
         document.addEventListener('DOMContentLoaded', function() {
             const passwordInput = document.getElementById('motDePasse');
             const passwordToggle = document.getElementById('password-toggle');
             const loginForm = document.getElementById('loginForm');
             const loginErrorAlert = document.getElementById('loginErrorAlert');
             const loginErrorMessage = document.getElementById('loginErrorMessage');
             const submitBtn = document.getElementById('loginSubmitBtn');
             const submitBtnSpinner = submitBtn.querySelector('.spinner-border');
             const submitBtnText = submitBtn.childNodes[submitBtn.childNodes.length - 1]; // Pour garder le texte original

             // Afficher/Masquer mot de passe
             if (passwordToggle && passwordInput) {
                 passwordToggle.addEventListener('click', function() {
                     const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                     passwordInput.setAttribute('type', type);
                     // Changer l'icône
                     this.querySelector('i').classList.toggle('ri-eye-line');
                     this.querySelector('i').classList.toggle('ri-eye-off-line');
                 });
             }

             // Gestion de la soumission (Exemple simple avec feedback)
             if (loginForm) {
                 loginForm.addEventListener('submit', function(event) {
                     event.preventDefault(); // Empêche l'envoi HTML normal

                     // Cacher l'alerte d'erreur précédente
                     loginErrorAlert.classList.add('d-none');

                     // Afficher spinner et désactiver bouton
                     submitBtnSpinner.classList.remove('d-none');
                     submitBtnText.textContent = ' Connexion...'; // Ajouter espace avant
                     submitBtn.disabled = true;

                     const formData = new FormData(loginForm);

                     // --- Simulation d'appel AJAX ---
                     // TODO: Remplacer par un vrai appel fetch vers loginForm.action (backend/login_process.php)
                     console.log("Tentative de connexion avec:", Object.fromEntries(formData));
                     setTimeout(() => {
                         // Simuler une réponse du backend
                         const backendResponse = {
                             success: false, // Mettre à true pour simuler succès
                             message: "Email ou mot de passe incorrect.",
                             redirectUrl: 'notaire-dashboard.html' // URL où rediriger si succès
                             // Ou: redirectUrl: 'locataire-dashboard.html'
                             // Ou: redirectUrl: 'proprietaire-dashboard.html'
                         };

                         // Réactiver bouton
                         submitBtnSpinner.classList.add('d-none');
                         submitBtnText.textContent = ' Se Connecter'; // Remettre texte original
                         submitBtn.disabled = false;

                         if (backendResponse.success) {
                             // Redirection vers le tableau de bord approprié
                              alert("Connexion réussie ! Redirection..."); // Feedback temporaire
                             window.location.href = backendResponse.redirectUrl;
                         } else {
                             // Afficher message d'erreur
                             loginErrorMessage.textContent = backendResponse.message || "Une erreur est survenue.";
                             loginErrorAlert.classList.remove('d-none');
                         }

                     }, 1500); // Simuler délai réseau
                     // --- Fin Simulation AJAX ---
                 });
             }
         });
     </script>
